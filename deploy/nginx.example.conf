# nginx in front of the broker: TLS termination, the real client address in
# X-Real-IP, /metrics restricted. The broker listens on 127.0.0.1:8080
# (TLS_BROKER_LISTEN) and its configuration must trust this proxy:
#
#   server:
#     external_url: https://broker.example.com
#     trusted_proxies: [127.0.0.1]
#     real_ip_header: X-Real-IP
#
# See docs/deployment.md.

upstream tls_broker {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name broker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name broker.example.com;

    ssl_certificate     /etc/nginx/tls/broker.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/broker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ACME requests and DNS proxy bodies are small; the UI config editor is
    # the largest form.
    client_max_body_size 1m;

    # Exactly one address, the TCP peer nginx saw. Never pass a client
    # supplied X-Forwarded-For: the broker ignores it anyway.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   "";
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # Held requests: ACME newOrder/finalize wait for admission (scheduler
    # admit_wait/finalize_wait), /cert/ waits for synchronous issuance
    # (direct.issue_timeout, default 4m), /dns/present for propagation
    # (dns_proxy.present_timeout, default 4m). Keep these above them.
    proxy_read_timeout 6m;
    proxy_send_timeout 6m;
    proxy_buffering    off;

    location / {
        proxy_pass http://tls_broker;
    }

    # Prometheus only from the monitoring network.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;     # adjust to your Prometheus
        deny  all;
        proxy_pass http://tls_broker;
    }
}
