{{define "content"}}
<div class="signin">
<a class="brand" href="/ui/">{{template "brandmark"}}<span>TLS broker</span></a>
<h1>Sign in</h1>
<p class="lede">Use your directory (LDAP) account. If the directory is down, the local administrator account still works.</p>
{{if .Data.Error}}<div class="notice error" role="alert"><p>{{.Data.Error}}</p></div>{{end}}
<form method="post" action="/ui/login" class="form">
<input type="hidden" name="next" value="{{.Data.Next}}">
<label>Username <input name="username" value="{{.Data.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit" class="primary">Sign in</button>
</form>
</div>
{{end}}
